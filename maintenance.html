<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boat Maintenance Log v0.22</title>
<style>
:root{
  --bg:#f5f7f8;--card:#fff;--text:#172026;--muted:#66737d;--line:#d9e0e4;
  --accent:#1f5f78;--accent2:#eaf3f6;--bad:#9b2c2c;--warn:#8a5a00;--good:#2f6f48;
  --shadow:0 1px 3px rgba(0,0,0,.08);--radius:12px
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:#173747;color:white;padding:18px 22px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header h1{font-size:20px;margin:0}.sub{font-size:13px;opacity:.8}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
button,.button{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
button.primary,.button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
nav{display:flex;gap:14px;align-items:center;padding:9px 16px;background:#fff;border-bottom:1px solid var(--line);overflow:auto}
.nav-group{display:flex;gap:4px;align-items:center;white-space:nowrap}
.nav-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:750;margin-right:3px}
.nav-divider{width:1px;height:28px;background:var(--line);flex:0 0 auto}
nav button{border:0;background:transparent;padding:9px 12px;white-space:nowrap}
nav button.active{background:var(--accent2);color:var(--accent);font-weight:650}
.editor-card{margin-top:14px;border-top:4px solid var(--accent)}
.editor-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:12px}
.editor-head h2{margin-bottom:3px}
.list-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:4px}
.list-head h2{margin:0}
.log-btn{padding:5px 9px;font-size:12px}
tr.clickable td{transition:background .08s}
tr.clickable:hover td{background:#f3f8fa}
main{max-width:1180px;margin:0 auto;padding:20px}
.notice{background:#fff8dc;border:1px solid #ead99c;padding:12px 14px;border-radius:10px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}
.metric{font-size:28px;font-weight:750;margin-top:5px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
h2{font-size:20px;margin:0 0 14px}h3{font-size:16px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:650}
tr.clickable:hover{background:#f8fbfc;cursor:pointer}
.badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:650}
.overdue{background:#fde7e7;color:var(--bad)}.soon{background:#fff1c9;color:var(--warn)}.ok{background:#e6f4ea;color:var(--good)}.unknown{background:#edf0f2;color:#59656d}.complete{background:#e8edf8;color:#40527b}
.row{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-bottom:10px}
.field{grid-column:span 6}.field.full{grid-column:span 12}.field.third{grid-column:span 4}
label{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-bottom:4px}
input,select,textarea{width:100%;padding:9px;border:1px solid #cbd4d9;border-radius:8px;background:#fff;color:var(--text);font:inherit}
textarea{min-height:78px;resize:vertical}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.muted{color:var(--muted)}.small{font-size:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.task-check{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid #edf0f2}.task-check input{width:auto;margin-top:3px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.statusline{font-size:13px}.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#888;margin-right:6px}.status-dot.live{background:#3d8b5f}.status-dot.dirty{background:#c27b18}
.meter-age{font-size:12px}.meter-age.aging{color:var(--warn);font-weight:700}.meter-age.stale{color:var(--bad);font-weight:750}
.stale-note{color:var(--bad);font-weight:700}.aging-note{color:var(--warn);font-weight:700}
.dashboard-meter-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
.dashboard-meter-row:last-child{border-bottom:0}
.dashboard-meter-row>div{min-width:0}
.dashboard-meter-row input{padding:7px 8px;min-width:0}
.dashboard-meter-row button{padding:8px 10px;width:100%}
.dashboard-meter-row>div:last-child{grid-column:1/-1}
.dashboard-meter-name{grid-column:1/-1;min-width:0}
.dashboard-meter-name strong{display:block}
.table-scroll{max-height:520px;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.table-scroll.compact{max-height:340px}
.table-scroll table{margin:0}
.table-scroll thead th{position:sticky;top:0;background:var(--card);z-index:2;box-shadow:0 1px 0 var(--line)}
.toolbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin:10px 0 12px}
.toolbar .grow{flex:1 1 240px;min-width:180px}
.toolbar .short{flex:0 1 180px;min-width:150px}
.toolbar button.active-filter{background:var(--accent2);border-color:#bfd4dc;color:var(--accent);font-weight:700}
.result-count{font-size:12px;color:var(--muted);margin-left:auto;align-self:center}
.dashboard-left-stack{grid-column:span 8;display:grid;gap:14px;align-content:start;min-width:0}
.dashboard-right-stack{grid-column:span 4;align-self:start;min-width:0}
.dashboard-left-stack>.card,.dashboard-right-stack>.card{min-width:0}
.dashboard-meter-scroll{max-height:720px;overflow:auto;padding-right:6px;margin-right:-6px}
.history-summary{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 12px}
.history-summary .summary-item{font-size:13px;color:var(--muted)}
.history-summary strong{color:var(--text)}
.task-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.task-actions button{white-space:nowrap}
.detail-row td{padding:0!important;background:var(--panel)}
.task-detail{padding:15px 17px 17px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.task-detail-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(220px,.8fr);gap:18px}
.task-detail h3{margin:0 0 6px;font-size:14px}
.task-detail-text{white-space:pre-wrap;line-height:1.48}
.task-detail-meta{display:grid;gap:11px;align-content:start}
.task-detail-meta .meta-block{font-size:13px}
.task-detail-meta .meta-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:3px}
.task-detail a{overflow-wrap:anywhere}
@media(max-width:800px){
  .task-detail-grid{grid-template-columns:1fr}

  .dashboard-left-stack,.dashboard-right-stack{grid-column:span 12}
}
@media(max-width:700px){
  .dashboard-meter-row{grid-template-columns:1fr}.dashboard-meter-name,.dashboard-meter-row>div:last-child{grid-column:1}
  .table-scroll,.table-scroll.compact,.dashboard-meter-scroll{max-height:none;overflow:visible;border-top:0;border-bottom:0;padding-right:0;margin-right:0}
  .table-scroll thead th{position:static;box-shadow:none}
  .result-count{width:100%;margin-left:0}
}
.hidden{display:none!important}
@media(max-width:800px){.span-8,.span-6,.span-4{grid-column:span 12}.field,.field.third{grid-column:span 12}main{padding:12px}header{padding:14px}.nav-label{display:none}.nav-divider{height:24px}nav{gap:6px;padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="appTitle">Boat Maintenance Log</h1>
    <div class="sub" id="datasetStatus">No boat data loaded</div>
  </div>
  <div class="top-actions">
    <button class="ghost hidden" id="retrySaveBtn" type="button">Retry save</button>
    <button class="ghost" id="refreshBtn" type="button">Refresh</button>
  </div>
</header>

<nav>
  <div class="nav-group">
    <span class="nav-label">Use</span>
    <button data-view="dashboard" class="active">Dashboard</button>
    <button data-view="log">Log Work</button>
    <button data-view="history">Work History</button>
  </div>
  <div class="nav-divider"></div>
  <div class="nav-group">
    <span class="nav-label">Setup</span>
    <button data-view="boat">Boat Settings</button>
    <button data-view="equipment">Equipment</button>
    <button data-view="maintenance">Maintenance Schedule</button>
    <button data-view="meters">Hours & Meters</button>
  </div>
</nav>

<main>
  <div id="browserNotice" class="notice hidden"></div>
  <div id="noData" class="card">
    <h2>Connecting to your boat</h2>
    <p id="connectionMessage">Loading maintenance records from the server…</p>
  </div>

  <section id="dashboard" class="view hidden"></section>
  <section id="log" class="view hidden"></section>
  <section id="history" class="view hidden"></section>
  <section id="equipment" class="view hidden"></section>
  <section id="maintenance" class="view hidden"></section>
  <section id="meters" class="view hidden"></section>
  <section id="boat" class="view hidden"></section>
</main>

<script>
"use strict";

/* ---------- application state ---------- */
const state = {
  files: {},
  dirty: false,
  selectedEquipmentId: null,
  selectedTaskId: null,
  equipmentEditorOpen: false,
  taskEditorOpen: false,
  meterEditorOpen: false,
  selectedMeterId: null,
  meterEditorMode: null,
  logPrefillTaskId: null,
  revision: null,
  csrfToken: null,
  generation: 0,
  saving: false,
  loading: false,
  draftDirty: false,
  saveError: "",
  connectionError: "",
  conflict: false,
  newerData: false,
  dashboardMaintenanceMode: "priority",
  dashboardMaintenanceSearch: "",
  equipmentSearch: "",
  maintenanceSearch: "",
  maintenanceStatusFilter: "all",
  meterSearch: "",
  recentWorkExpanded: false,
  historySearch: "",
  historyEquipmentFilter: "all",
  historyFromDate: "",
  historyToDate: "",
  dashboardExpandedTasks: [],
  scheduleExpandedTasks: []
};

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function uid(prefix){
  if (crypto.randomUUID) return prefix+"_"+crypto.randomUUID();
  return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2);
}
function esc(s=""){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function parseDateOnly(s){ if(!s)return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtDateObj(d){ return d?d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):"—"; }
function fmtDate(s){ if(!s)return "—"; const d=parseDateOnly(s); return d?fmtDateObj(d):s; }
function fmtObservedAt(s){
  if(!s)return "—";
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return fmtDate(s);
  const d=new Date(s);
  if(Number.isNaN(d.getTime())) return s;
  return d.toLocaleString(undefined,{year:"numeric",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}
function readingAgeDays(r){
  if(!r?.observed_at)return Infinity;
  const ds=r.observed_at.slice(0,10);
  const d=parseDateOnly(ds);
  const now=parseDateOnly(todayISO());
  return d?Math.max(0,Math.floor((now-d)/86400000)):Infinity;
}
function readingFreshness(r){
  const days=readingAgeDays(r);
  if(!Number.isFinite(days)) return {level:"stale",days,label:"No recent reading"};
  if(days>30) return {level:"stale",days,label:`Meter stale — ${days} days old`};
  if(days>14) return {level:"aging",days,label:`Reading ${days} days old`};
  return {level:"fresh",days,label:days===0?"Updated today":`${days} days old`};
}
function num(v,d=0){ return Number(v).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d}); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------- server storage ---------- */
async function requestJSON(method, body){
  const response=await fetch("/api/data",{
    method, cache:"no-store", credentials:"same-origin",
    headers:body?{"Content-Type":"application/json","X-CSRF-Token":state.csrfToken}: {},
    ...(body?{body:JSON.stringify(body)}:{}),
    signal:AbortSignal.timeout(20000)
  });
  const result=await response.json();
  if(!response.ok){
    const error=new Error(result.error||"The server could not complete the request.");
    error.status=response.status;
    throw error;
  }
  return result;
}
function storageNotice(){
  const notice=$("#browserNotice");
  let message=state.saveError || state.connectionError;
  if(state.conflict) message="Another device saved changes. Your changes have not been saved. Refresh to load the latest records before editing again.";
  else if(state.newerData && !message) message="New records are available from another device. Finish your current entry or refresh to load them.";
  notice.textContent=message;
  notice.classList.toggle("hidden",!message);
  $("#retrySaveBtn").classList.toggle("hidden",!state.dirty || state.saving || state.conflict);
  $("#refreshBtn").disabled=state.saving || state.loading;
  // A conflicted snapshot must not accept more edits until it is reloaded.
  $("main").classList.toggle("conflicted",state.conflict);
  $$("main form button[type=submit]").forEach(button=>button.disabled=state.conflict);
}
async function loadServer(manual=false){
  if(state.saving || state.loading)return;
  if(manual && (state.dirty || state.draftDirty) &&
     !confirm("Refresh and discard your unsaved changes? The latest server records will be loaded."))return;
  const generation=state.generation;
  state.loading=true;
  storageNotice();
  try{
    const snapshot=await requestJSON("GET");
    state.csrfToken=snapshot.csrf_token;
    state.connectionError="";
    // Do not replace work entered while this read was in flight.
    if(generation!==state.generation || state.saving)return;
    if(!manual && (state.dirty || state.draftDirty)){
      state.newerData=snapshot.revision!==state.revision;
      return;
    }
    if(!manual && state.revision===snapshot.revision)return;
    state.files=snapshot.files;
    state.revision=snapshot.revision;
    state.dirty=false;state.draftDirty=false;state.saveError="";state.conflict=false;state.newerData=false;
    if(manual){
      state.selectedEquipmentId=null;state.equipmentEditorOpen=false;
      state.selectedTaskId=null;state.taskEditorOpen=false;
      state.selectedMeterId=null;state.meterEditorOpen=false;state.logPrefillTaskId=null;
    }
    if($("#noData").classList.contains("hidden")) renderAll();
    else afterLoad();
  }catch(error){
    state.connectionError="Cannot reach the server. Keep this page open if you have unsaved changes, then try again.";
    $("#connectionMessage").textContent=location.protocol==="file:"?
      "Open this app using your Pi’s HTTPS address. It only runs through the server.":
      "Unable to load server data. Check that the Pi is running, then select Refresh.";
  }finally{
    state.loading=false;updateHeader();storageNotice();
  }
}
async function persistAll(){
  if(state.saving || state.conflict || !state.dirty)return;
  state.saving=true;state.saveError="";
  updateHeader();storageNotice();
  try{
    while(state.dirty){
      const generation=state.generation;
      const files=clone(state.files);
      const result=await requestJSON("PUT",{revision:state.revision,files});
      state.revision=result.revision;
      state.connectionError="";state.newerData=false;
      if(generation===state.generation)state.dirty=false;
    }
  }catch(error){
    state.conflict=error.status===409;
    state.saveError=error.status===422?error.message:
      "Changes have not been confirmed saved. Keep this page open and select Retry save when the server is available.";
  }finally{
    state.saving=false;updateHeader();storageNotice();
  }
}
function markChanged(){
  state.files.manifest.modified_at=new Date().toISOString();
  state.generation++;state.dirty=true;state.draftDirty=false;
  persistAll();
}

/* ---------- maintenance logic ---------- */
function equipmentById(id){return state.files.equipment.records.find(x=>x.id===id)}
function meterById(id){return state.files.meters.records.find(x=>x.id===id)}
function taskById(id){return state.files.maintenance_tasks.records.find(x=>x.id===id)}
function latestReading(meterId,atOrBefore=null){
  const rows=state.files.meter_readings.filter(r=>r.meter_id===meterId && (!atOrBefore || r.observed_at.slice(0,10)<=atOrBefore));
  rows.sort((a,b)=>a.observed_at.localeCompare(b.observed_at));
  return rows.at(-1)||null;
}
function latestCompletion(taskId){
  return state.files.service_history.filter(s=>(s.completed_task_ids||[]).includes(taskId))
    .sort((a,b)=>(a.date||"").localeCompare(b.date||"")).at(-1)||null;
}
function serviceMeterValue(service,meterId){
  return (service?.meter_values||[]).find(x=>x.meter_id===meterId)||null;
}
function completionMeterBasis(task,completion,meterId){
  if(!completion) return (task.baseline?.meter_values||[]).find(x=>x.meter_id===meterId)||null;
  const exact=serviceMeterValue(completion,meterId);
  if(exact) return exact;
  // If work was logged without a meter value, use the latest known reading
  // at or before the service date. Do NOT fall back to the original task baseline.
  const prior=latestReading(meterId,completion.date);
  if(prior) return {meter_id:meterId,value:prior.value,unit:prior.unit,quality:prior.quality||"estimated"};
  return null;
}

function defaultWarningForTrigger(t,basisDate=null){
  if(t.warning?.value) return Number(t.warning.value);
  if(t.type==="meter") return Math.max(Number(t.interval)*0.10, 1);
  if(t.type==="calendar"){
    const mult={days:1,weeks:7,months:30.4375,years:365.25}[t.unit]||1;
    return Math.max(Number(t.interval)*mult*0.10,1);
  }
  if(t.type==="date") return 14;
  if(t.type==="meter_value") return Math.max(Math.abs(Number(t.due_value))*0.05,1);
  return 1;
}
function triggerUrgencyRatio(task,t,completion){
  const basisDate=completion?.date || task.baseline?.date || null;
  const now=parseDateOnly(todayISO());

  if(t.type==="calendar"){
    if(!basisDate) return Infinity;
    const due=addCalendar(parseDateOnly(basisDate),Number(t.interval),t.unit);
    const rem=daysBetween(now,due);
    const warn=t.warning ? warningToDays(t.warning) : defaultWarningForTrigger(t,basisDate);
    return rem/Math.max(warn,0.0001);
  }
  if(t.type==="meter"){
    const baseMv=completionMeterBasis(task,completion,t.meter_id);
    const current=latestReading(t.meter_id);
    if(!baseMv || !current) return Infinity;
    const rem=(Number(baseMv.value)+Number(t.interval))-Number(current.value);
    const warn=Number(t.warning?.value||defaultWarningForTrigger(t));
    return rem/Math.max(warn,0.0001);
  }
  if(t.type==="date"){
    const due=parseDateOnly(t.due_date);
    const rem=daysBetween(now,due);
    const warn=t.warning ? warningToDays(t.warning) : defaultWarningForTrigger(t);
    return rem/Math.max(warn,0.0001);
  }
  if(t.type==="meter_value"){
    const current=latestReading(t.meter_id);
    if(!current) return Infinity;
    const rem=Number(t.due_value)-Number(current.value);
    const warn=Number(t.warning?.value||defaultWarningForTrigger(t));
    return rem/Math.max(warn,0.0001);
  }
  return Infinity;
}
function taskUrgency(task){
  const completion=latestCompletion(task.id);
  if(task.task_kind==="one_time" && completion) return Infinity;
  const vals=(task.schedule?.triggers||[]).map(t=>triggerUrgencyRatio(task,t,completion)).filter(Number.isFinite);
  return vals.length?Math.min(...vals):Infinity;
}
function addCalendar(date,interval,unit){
  const d=new Date(date);
  if(unit==="days") d.setDate(d.getDate()+interval);
  if(unit==="weeks") d.setDate(d.getDate()+interval*7);
  if(unit==="months"){
    const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+interval);
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last));
  }
  if(unit==="years"){
    const m=d.getMonth(),day=d.getDate(); d.setDate(1); d.setFullYear(d.getFullYear()+interval); d.setMonth(m);
    const last=new Date(d.getFullYear(),m+1,0).getDate(); d.setDate(Math.min(day,last));
  }
  return d;
}
function daysBetween(a,b){return Math.ceil((b-a)/86400000)}
function taskStatus(task){
  if(!task.active) return {rank:9,status:"inactive",label:"Inactive",details:[]};
  const completion=latestCompletion(task.id);
  if(task.task_kind==="one_time" && completion) return {rank:8,status:"complete",label:"Complete",details:["Completed "+fmtDate(completion.date)]};

  const basisDate=completion?.date || task.baseline?.date || null;
  const details=[]; let worst={rank:0,status:"ok",label:"Not due"};
  const now=parseDateOnly(todayISO());

  for(const t of (task.schedule?.triggers||[])){
    if(t.type==="calendar"){
      if(!basisDate){details.push("Calendar due: unknown"); worst=Math.max(worst.rank,1)===1?{rank:1,status:"unknown",label:"Needs info"}:worst;continue}
      const due=addCalendar(parseDateOnly(basisDate),Number(t.interval),t.unit);
      const rem=daysBetween(now,due);
      details.push("Due "+fmtDateObj(due)+" ("+(rem>=0?rem+" days":"overdue "+Math.abs(rem)+" days")+")");
      const warnDays=t.warning ? warningToDays(t.warning) : 0;
      if(rem<0) worst=pickWorse(worst,{rank:4,status:"overdue",label:"Overdue"});
      else if(rem===0) worst=pickWorse(worst,{rank:3,status:"soon",label:"Due now"});
      else if(warnDays && rem<=warnDays) worst=pickWorse(worst,{rank:2,status:"soon",label:"Due soon"});
    }else if(t.type==="meter"){
      const baseMv=completionMeterBasis(task,completion,t.meter_id);
      const current=latestReading(t.meter_id);
      if(!baseMv || !current){details.push("Meter due: unknown"); worst=pickWorse(worst,{rank:1,status:"unknown",label:"Needs info"});continue}
      const freshness=readingFreshness(current);
      if(freshness.level==="stale") details.push("⚠ "+freshness.label);
      else if(freshness.level==="aging") details.push(freshness.label);
      const due=Number(baseMv.value)+Number(t.interval), rem=due-Number(current.value);
      const meter=meterById(t.meter_id), unit=t.unit||meter?.unit||"";
      const displayUnit=unit==="hours"?"operating hours":unit;
      details.push("Due at "+num(due)+" "+displayUnit+" ("+(rem>=0?num(rem)+" "+displayUnit+" remaining":num(Math.abs(rem))+" "+displayUnit+" overdue")+")");
      const warn=Number(t.warning?.value||0);
      if(rem<0) worst=pickWorse(worst,{rank:4,status:"overdue",label:"Overdue"});
      else if(rem===0) worst=pickWorse(worst,{rank:3,status:"soon",label:"Due now"});
      else if(warn && rem<=warn) worst=pickWorse(worst,{rank:2,status:"soon",label:"Due soon"});
    }else if(t.type==="date"){
      const due=parseDateOnly(t.due_date),rem=daysBetween(now,due);
      details.push("Due "+fmtDate(t.due_date)+(rem>=0?" ("+rem+" days)":" (overdue "+Math.abs(rem)+" days)"));
      const warnDays=t.warning ? warningToDays(t.warning) : 0;
      if(rem<0) worst=pickWorse(worst,{rank:4,status:"overdue",label:"Overdue"});
      else if(rem===0) worst=pickWorse(worst,{rank:3,status:"soon",label:"Due now"});
      else if(warnDays && rem<=warnDays) worst=pickWorse(worst,{rank:2,status:"soon",label:"Due soon"});
    }else if(t.type==="meter_value"){
      const current=latestReading(t.meter_id);
      if(!current){details.push("Meter due: unknown");worst=pickWorse(worst,{rank:1,status:"unknown",label:"Needs info"});continue}
      const freshness=readingFreshness(current);
      if(freshness.level==="stale") details.push("⚠ "+freshness.label);
      else if(freshness.level==="aging") details.push(freshness.label);
      const rem=Number(t.due_value)-Number(current.value);
      const displayUnit=t.unit==="hours"?"operating hours":t.unit;
      details.push("Due at "+num(t.due_value)+" "+displayUnit+" ("+(rem>=0?num(rem)+" "+displayUnit+" remaining":num(Math.abs(rem))+" "+displayUnit+" overdue")+")");
      const warn=Number(t.warning?.value||0);
      if(rem<0) worst=pickWorse(worst,{rank:4,status:"overdue",label:"Overdue"});
      else if(rem===0) worst=pickWorse(worst,{rank:3,status:"soon",label:"Due now"});
      else if(warn && rem<=warn) worst=pickWorse(worst,{rank:2,status:"soon",label:"Due soon"});
    }
  }
  if(task.defer_until && worst.rank>=3) worst.label += " (deferred)";
  return {...worst,details,completion,urgency:taskUrgency(task)};
}
function warningToDays(w){const n=Number(w.value||0);return w.unit==="weeks"?n*7:w.unit==="months"?n*30:w.unit==="years"?n*365:n}
function pickWorse(a,b){return b.rank>a.rank?b:a}
function containsSearch(parts,query){
  const q=String(query||"").trim().toLowerCase();
  if(!q)return true;
  return parts.filter(Boolean).join(" ").toLowerCase().includes(q);
}
function taskMatchesSearch(task,query){
  const eq=equipmentById(task.equipment_id);
  return containsSearch([task.title,task.category,eq?.name,eq?.manufacturer,eq?.model,schedulePlain(task)],query);
}


function selectorEscape(s){
  if(window.CSS?.escape)return CSS.escape(String(s));
  return String(s).replace(/["\\]/g,"\\$&");
}
function restoreListScroll(viewSelector,scrollTop,detailButtonSelector){
  const view=$(viewSelector);
  if(!view)return;
  const pane=view.querySelector(".table-scroll");
  if(!pane)return;
  pane.scrollTop=scrollTop;
  if(!detailButtonSelector)return;

  const btn=view.querySelector(detailButtonSelector);
  if(!btn)return;
  const row=btn.closest("tr");
  const detail=row?.nextElementSibling?.classList.contains("detail-row") ? row.nextElementSibling : row;
  if(!detail)return;

  const paneRect=pane.getBoundingClientRect();
  const detailRect=detail.getBoundingClientRect();

  // Adjust ONLY the internal pane. Do not scroll the page.
  if(detailRect.bottom>paneRect.bottom){
    pane.scrollTop += detailRect.bottom-paneRect.bottom+10;
  }else if(row?.getBoundingClientRect().top<paneRect.top){
    pane.scrollTop -= paneRect.top-row.getBoundingClientRect().top+10;
  }
}

function taskSourceText(task){
  const src=task?.source;
  if(!src)return "";
  if(typeof src==="string")return src;
  return src.reference||src.name||src.type||"";
}
function taskSourceHtml(task){
  const text=taskSourceText(task);
  if(!text)return "—";
  if(/^https?:\/\//i.test(text)){
    return `<a href="${esc(text)}" target="_blank" rel="noopener">${esc(text)}</a>`;
  }
  return esc(text);
}
function taskDetailHtml(task,status,context){
  const procedure=(task.procedure||"").trim();
  const notes=(task.notes||"").trim();
  const source=taskSourceHtml(task);
  const next=status?.details?.length ? status.details.map(esc).join("<br>") : "—";

        ${notes?`<div style="margin-top:12px"><h3>Specifications / notes</h3><div class="task-detail-text">${esc(notes)}</div></div>`:""}
      </div>

        <div class="meta-block"><span class="meta-label">Source / reference</span>${source}</div>
        <div class="task-actions" style="justify-content:flex-start">
          ${context==="dashboard"?`<button type="button" class="primary" data-detail-log="${esc(task.id)}">Log work</button>`:""}

function taskExpanded(context,id){
  const arr=context==="dashboard"?state.dashboardExpandedTasks:state.scheduleExpandedTasks;
  return arr.includes(id);
}
function toggleTaskExpanded(context,id){
  const key=context==="dashboard"?"dashboardExpandedTasks":"scheduleExpandedTasks";
  const arr=state[key];
  state[key]=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];
}

function statusFilterMatch(st,filter){
  if(filter==="all") return true;
  if(filter==="overdue") return st.status==="overdue";
  if(filter==="soon") return st.status==="soon";
  if(filter==="notdue") return st.status==="ok";
  if(filter==="needsinfo") return st.status==="unknown";
  return true;
}
function taskSortRows(rows){
  rows.sort((a,b)=>{
    const rankDiff=(b.s.rank??0)-(a.s.rank??0);
    if(rankDiff) return rankDiff;
    const au=Number.isFinite(a.s.urgency)?a.s.urgency:Infinity;
    const bu=Number.isFinite(b.s.urgency)?b.s.urgency:Infinity;
    if(au!==bu) return au-bu;
    return a.t.title.localeCompare(b.t.title);
  });
  return rows;
}
function schedulePlain(task){
  const out=[];
  for(const t of task.schedule?.triggers||[]){
    if(t.type==="meter"){
      const unit=t.unit==="hours"?"operating hours":t.unit;
      out.push(`Every ${t.interval} ${unit}`);
    }
    else if(t.type==="calendar"){
      const unit=t.unit==="months"?"calendar months":t.unit==="years"?"calendar years":t.unit;
      out.push(`Every ${t.interval} ${unit}`);
    }
    else if(t.type==="date") out.push(`By ${fmtDate(t.due_date)}`);
    else if(t.type==="meter_value") out.push(`At ${num(t.due_value)} ${t.unit}`);
  }
  return out.join(" or ")||"No schedule";
}

function csvCell(v){
  const text=String(v??"");
  return /[",\n\r]/.test(text) ? `"${text.replace(/"/g,'""')}"` : text;
}
function serviceEquipmentNames(ev){
  return (ev.equipment_ids||[]).map(id=>equipmentById(id)?.name).filter(Boolean);
}
function completedTaskNames(ev){
  return (ev.completed_task_ids||[]).map(id=>taskById(id)?.title).filter(Boolean);
}
function serviceMeterText(ev){
  return (ev.meter_values||[]).map(x=>{
    const meter=meterById(x.meter_id);
    const rawUnit=x.unit||meter?.unit||"";
    const displayUnit=rawUnit==="hours"?"operating hours":rawUnit;
    return `${meter?.name||x.meter_id}: ${num(x.value)} ${displayUnit}`.trim();
  }).join("; ");
}
function filteredHistory(){
  let rows=state.files.service_history.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const q=String(state.historySearch||"").trim().toLowerCase();
  return rows.filter(ev=>{
    const equipment=serviceEquipmentNames(ev);
    const tasks=completedTaskNames(ev);
    if(state.historyEquipmentFilter!=="all" && !(ev.equipment_ids||[]).includes(state.historyEquipmentFilter)) return false;
    if(state.historyFromDate && (ev.date||"")<state.historyFromDate) return false;
    if(state.historyToDate && (ev.date||"")>state.historyToDate) return false;
    if(q){
      const haystack=[
        ev.summary,ev.notes,equipment.join(" "),tasks.join(" "),serviceMeterText(ev)
      ].filter(Boolean).join(" ").toLowerCase();
      if(!haystack.includes(q)) return false;
    }
    return true;
  });
}
function exportHistoryCsv(){
  const rows=filteredHistory();
  const headers=[
    "Date","Work","Equipment","Scheduled items completed","Meter readings","Notes"
  ];
  const lines=[headers.map(csvCell).join(",")];
  rows.forEach(ev=>{
    lines.push([
      ev.date||"",
      ev.summary||"",
      serviceEquipmentNames(ev).join("; "),
      completedTaskNames(ev).join("; "),
      serviceMeterText(ev),
      ev.notes||""
    ].map(csvCell).join(","));
  });
  const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const vessel=(state.files.vessel.record.name||"boat").replace(/[^a-z0-9_-]+/gi,"-").replace(/^-|-$/g,"");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`${vessel}-work-history.csv`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

       <h3>Repeat when either limit is reached</h3><div class="small muted" style="margin:-5px 0 10px">Operating hours come from the equipment meter; calendar limits are based on dates.</div>
       <div class="row">
        <div class="field"><label>Every ___ operating hours</label><input type="number" min="0" step="1" name="hours_interval" value="${esc(hourTrig?.interval||"")}"></div>
        <div class="field"><label>Warn this many operating hours early</label><input type="number" min="0" step="1" name="hours_warning" value="${esc(hourTrig?.warning?.value||"")}"></div>

       <div class="row">
        <div class="field"><label>Every ___ calendar months</label><input type="number" min="0" step="1" name="months_interval" value="${esc(monthTrig?.interval||"")}"></div>
        <div class="field"><label>Warn this many calendar days early</label><input type="number" min="0" step="1" name="days_warning" value="${esc(monthTrig?.warning?.value||"")}"></div>
       </div>
       <p class="small muted">An operating-hours interval requires an hour meter for the selected equipment. You can add one under Hours & Meters.</p>
      </div>

       <div class="row"><div class="field"><label>Due date</label><input type="date" name="due_date" value="${esc(dateTrig?.due_date||"")}"></div></div>
      </div>
      <div class="row"><div class="field full"><label>Procedure / notes</label><textarea name="procedure">${esc(selected?.procedure||"")}</textarea></div></div>
      <div class="actions">
        <button class="primary" type="submit">${selected?"Save changes":"Add maintenance item"}</button>

    toggleTaskExpanded("schedule",id);
    renderMaintenance();
    requestAnimationFrame(()=>restoreListScroll("#maintenance",scrollTop,`[data-schedule-details="${selectorEscape(id)}"]`));

  $$("[data-edit-task]").forEach(btn=>btn.addEventListener("click",()=>{
    state.selectedTaskId=btn.dataset.editTask;state.taskEditorOpen=true;renderMaintenance();
    setTimeout(()=>$("#taskEditor")?.scrollIntoView({behavior:"smooth",block:"start"}),0);
  }));
  $$("[data-detail-edit]").forEach(btn=>btn.addEventListener("click",()=>{
    state.selectedTaskId=btn.dataset.detailEdit;state.taskEditorOpen=true;renderMaintenance();
    setTimeout(()=>$("#taskEditor")?.scrollIntoView({behavior:"smooth",block:"start"}),0);
  }));
  $("#newTaskBtn").onclick=()=>{state.selectedTaskId=null;state.taskEditorOpen=true;renderMaintenance();setTimeout(()=>$("#taskEditor")?.scrollIntoView({behavior:"smooth",block:"start"}),0)};
  $("#cancelTaskBtn")?.addEventListener("click",()=>{state.selectedTaskId=null;state.taskEditorOpen=false;renderMaintenance()});
  $("#maintenanceSearch")?.addEventListener("input",e=>{state.maintenanceSearch=e.target.value;renderMaintenance();const i=$("#maintenanceSearch");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
  $("#maintenanceStatusFilter")?.addEventListener("change",e=>{state.maintenanceStatusFilter=e.target.value;renderMaintenance()});
  $("#taskKind")?.addEventListener("change",e=>{$("#recurringFields").classList.toggle("hidden",e.target.value!=="recurring");$("#oneTimeFields").classList.toggle("hidden",e.target.value==="recurring")});
  $("#taskForm")?.addEventListener("submit",e=>{
    e.preventDefault();const fd=new FormData(e.target);let rec=taskById(fd.get("id"));
    if(rec)rec=clone(rec);
    const eqid=fd.get("equipment_id"), kind=fd.get("task_kind");
    if(!rec){
      rec={id:uid("task"),equipment_id:eqid,title:"",category:null,active:true,task_kind:kind,schedule:{logic:"any",triggers:[]},baseline:{date:todayISO(),meter_values:[]},procedure:"",source:{type:"owner_program",reference:""},tags:[],notes:""};
    }
    rec.equipment_id=eqid;rec.title=fd.get("title");rec.category=fd.get("category")||null;rec.active=fd.get("active")==="on";rec.task_kind=kind;rec.procedure=fd.get("procedure")||"";
    const trs=[];
    if(kind==="recurring"){
      const h=Math.round(Number(fd.get("hours_interval")||0)), mo=Number(fd.get("months_interval")||0);
      if(h>0){
        const meter=state.files.meters.records.find(x=>x.equipment_id===eqid && x.kind==="hour_meter");
        if(!meter){alert("Please add an hour meter for this equipment first, or leave the hours interval blank.");return}
        const w=Math.round(Number(fd.get("hours_warning")||0));
        trs.push({type:"meter",meter_id:meter.id,interval:h,unit:"hours",...(w?{warning:{value:w,unit:"hours"}}:{})});
        if(!rec.baseline.meter_values?.some(x=>x.meter_id===meter.id)){
          const lr=latestReading(meter.id);
          if(lr) rec.baseline.meter_values=[...(rec.baseline.meter_values||[]),{meter_id:meter.id,value:Math.round(lr.value),unit:"hours"}];
        }
      }
      if(mo>0){
        const w=Number(fd.get("days_warning")||0);
        trs.push({type:"calendar",interval:mo,unit:"months",...(w?{warning:{value:w,unit:"days"}}:{})});
      }
      if(!trs.length){alert("Enter at least one repeat interval.");return}
    }else{
      const d=fd.get("due_date"); if(!d){alert("Choose a due date for the one-time job.");return}
      trs.push({type:"date",due_date:d,warning:{value:14,unit:"days"}});
    }
    rec.schedule={logic:"any",triggers:trs};
    const taskIndex=state.files.maintenance_tasks.records.findIndex(t=>t.id===rec.id);
    if(taskIndex<0)state.files.maintenance_tasks.records.push(rec);
    else state.files.maintenance_tasks.records[taskIndex]=rec;
    state.selectedTaskId=null;state.taskEditorOpen=false;markChanged();renderAll();
  });
}

      <div class="field full"><label>Notes</label><textarea name="notes"></textarea></div>
     </div>
     <button class="primary" type="submit">Save maintenance log</button>

   </div>`;
  function updateLogTasks(){
    const eqid=$("#logEq").value;
    const tasks=state.files.maintenance_tasks.records.filter(t=>t.active && t.equipment_id===eqid && !(t.task_kind==="one_time" && latestCompletion(t.id)));
    $("#logTasks").innerHTML=tasks.length?tasks.map(t=>`<label class="task-check"><input type="checkbox" name="completed_task" value="${esc(t.id)}" ${state.logPrefillTaskId===t.id?"checked":""}><span><strong>${esc(t.title)}</strong><br><span class="muted">${esc(schedulePlain(t))}</span></span></label>`).join(""):'<span class="muted">No open scheduled items for this equipment.</span>';
    const m=state.files.meters.records.find(x=>x.equipment_id===eqid && x.kind==="hour_meter");
    const lr=m?latestReading(m.id):null;
    const inp=$("[name=meter_value]");inp.disabled=!m;inp.placeholder=m?(lr?`Current: ${lr.value}`:"Enter hours"):"No hour meter configured";
  }
  $("#logEq").onchange=()=>{
    state.logPrefillTaskId=null;
    updateLogTasks();
  };
  if(preEqId) updateLogTasks();
  $("#logForm").onsubmit=e=>{
    e.preventDefault();const fd=new FormData(e.target),eqid=fd.get("equipment_id"),date=fd.get("date");
    const meter=state.files.meters.records.find(x=>x.equipment_id===eqid && x.kind==="hour_meter");
    const meterVal=fd.get("meter_value")!==""?Number(fd.get("meter_value")):null;
    const sv={
      record_type:"service_event",schema_version:state.files.manifest.schema_version,id:uid("svc"),date,
      recorded_at:new Date().toISOString(),summary:fd.get("summary"),equipment_ids:[eqid],
      completed_task_ids:fd.getAll("completed_task"),meter_values:meter&&meterVal!==null?[{meter_id:meter.id,value:meterVal,unit:meter.unit,quality:"exact"}]:[],
      parts_used:[],performed_by_ids:[],
      notes:fd.get("notes")||"",attachment_ids:[],tags:[]
    };
    state.files.service_history.push(sv);
    if(meter&&meterVal!==null) state.files.meter_readings.push({record_type:"meter_reading",schema_version:state.files.manifest.schema_version,id:uid("read"),meter_id:meter.id,observed_at:date,value:meterVal,displayed_value:meterVal,unit:meter.unit,source:"service_event",service_event_id:sv.id,quality:"exact",event:"observation",notes:""});
    state.logPrefillTaskId=null;
    markChanged();renderAll();
  };
}

          <td><button type="button" class="log-btn" data-update-meter="${esc(m.id)}">Update</button></td>
        </tr>`;
      }).join("")}
      </tbody></table>
    </div>

    ${editorOpen && mode==="update" && selected?`
    <div class="card span-12 editor-card" id="meterEditor">
      <div class="editor-head">
        <div>
          <h2>Update meter — ${esc(selected.name)}</h2>
          <div class="small muted">${esc(equipmentById(selected.equipment_id)?.name||"")} • current ${latestReading(selected.id)?num(latestReading(selected.id).value)+" "+esc(selected.unit):"reading not set"}</div>
        </div>
        <button type="button" id="cancelMeterBtn">Cancel</button>
      </div>
      <form id="meterReadingForm">
        <input type="hidden" name="meter_id" value="${esc(selected.id)}">
        <div class="row">
          <div class="field third"><label>New reading</label><input type="number" step="1" min="0" name="value" required></div>
          <div class="field third"><label>Date</label><input type="date" name="date" value="${todayISO()}" required></div>
          <div class="field third"><label>Notes (optional)</label><input name="notes" placeholder="e.g. gauge replaced"></div>
        </div>
        <div class="actions"><button class="primary" type="submit">Save reading</button></div>
      </form>
    </div>`:""}

    ${editorOpen && mode==="add"?`
    <div class="card span-12 editor-card" id="meterEditor">
      <div class="editor-head">
        <div>
          <h2>Add meter</h2>
          <div class="small muted">Create a counter used for maintenance tracking, such as engine or generator hours.</div>
        </div>
        <button type="button" id="cancelMeterBtn">Cancel</button>
      </div>
      <form id="newMeterForm">
        <div class="row">
          <div class="field"><label>Equipment</label><select name="equipment_id" required><option value="">Choose equipment…</option>${state.files.equipment.records.filter(x=>x.status==="active").map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select></div>
          <div class="field"><label>Name</label><input name="name" required placeholder="Main engine hours"></div>
          <div class="field third"><label>Type</label><select name="kind"><option value="hour_meter">Hour meter</option><option value="cycle_counter">Cycle counter</option><option value="distance">Distance</option><option value="custom">Other</option></select></div>
          <div class="field third"><label>Unit</label><input name="unit" value="hours" required></div>
          <div class="field third"><label>Starting reading (optional)</label><input type="number" min="0" step="1" name="starting_value"></div>
        </div>
        <div class="actions"><button class="primary" type="submit">Add meter</button></div>
      </form>
    </div>`:""}
   </div>`;

  $$("[data-meterid]").forEach(tr=>tr.onclick=()=>{
    state.selectedMeterId=tr.dataset.meterid;
    state.meterEditorMode="update";
    state.meterEditorOpen=true;
    renderMeters();
    setTimeout(()=>$("#meterEditor")?.scrollIntoView({behavior:"smooth",block:"start"}),0);
  });
  $$("[data-update-meter]").forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();
    state.selectedMeterId=btn.dataset.updateMeter;
    state.meterEditorMode="update";
    state.meterEditorOpen=true;
    renderMeters();
    setTimeout(()=>$("#meterEditor")?.scrollIntoView({behavior:"smooth",block:"start"}),0);
  });
  $("#newMeterBtn").onclick=()=>{
    state.selectedMeterId=null;
    state.meterEditorMode="add";
    state.meterEditorOpen=true;
    renderMeters();
    setTimeout(()=>$("#meterEditor")?.scrollIntoView({behavior:"smooth",block:"start"}),0);
  };
  $("#cancelMeterBtn")?.addEventListener("click",()=>{
    state.selectedMeterId=null;
    state.meterEditorMode=null;
    state.meterEditorOpen=false;
    renderMeters();
  });

  $("#meterReadingForm")?.addEventListener("submit",e=>{
    e.preventDefault();
    const fd=new FormData(e.target),m=meterById(fd.get("meter_id")),v=Number(fd.get("value")),date=fd.get("date");
    const last=latestReading(m.id);
    if(m.monotonic && last && v<last.value && !confirm(`This is lower than the previous reading (${last.value}). Save anyway?`)) return;

    state.files.meter_readings.push({
      record_type:"meter_reading",
      schema_version:state.files.manifest.schema_version,
      id:uid("read"),
      meter_id:m.id,
      observed_at:date,
      value:v,
      displayed_value:v,
      unit:m.unit,
      source:"manual",
      service_event_id:null,
      quality:"exact",
      event:"observation",
      notes:fd.get("notes")||""
    });
    state.selectedMeterId=null;state.meterEditorMode=null;state.meterEditorOpen=false;
    markChanged();renderAll();
  });

  $("#newMeterForm")?.addEventListener("submit",e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const kind=fd.get("kind")||"hour_meter";
    const unit=fd.get("unit")||"hours";
    const rec={
      id:uid("mtr"),
      equipment_id:fd.get("equipment_id"),
      name:fd.get("name"),
      kind,
      unit,
      precision:0.1,
      monotonic:true,
      notes:""
    };
    state.files.meters.records.push(rec);

    if(fd.get("starting_value")!==""){
      const v=Number(fd.get("starting_value"));
      state.files.meter_readings.push({
        record_type:"meter_reading",
        schema_version:state.files.manifest.schema_version,
        id:uid("read"),
        meter_id:rec.id,
        observed_at:todayISO(),
        value:v,
        displayed_value:v,
        unit:rec.unit,
        source:"manual",
        service_event_id:null,
        quality:"exact",
        event:"observation",
        notes:"Initial reading"
      });
    }

    state.selectedMeterId=rec.id;
    state.meterEditorMode="update";
    state.meterEditorOpen=false;
    markChanged();renderAll();
  });
}

/* ---------- events ---------- */
$("#refreshBtn").onclick=()=>loadServer(true);
$("#retrySaveBtn").onclick=async()=>{await loadServer();await persistAll()};
$$("nav button").forEach(b=>b.onclick=()=>{
  if(!state.files.vessel)return;
  if(b.dataset.view==="log"){state.logPrefillTaskId=null;renderLog();}
  showView(b.dataset.view);
});
$("main").addEventListener("input",e=>{
  if(e.target.closest("form")){state.draftDirty=true;state.generation++;}
});
$("main").addEventListener("change",e=>{
  if(e.target.closest("form")){state.draftDirty=true;state.generation++;}
});
// Block form submissions from a conflicted snapshot, including Enter-key submits.
$("main").addEventListener("submit",e=>{
  if(state.conflict){e.preventDefault();e.stopImmediatePropagation();storageNotice();}
},true);
loadServer();
setInterval(()=>{if(!document.hidden)loadServer()},15000);
window.addEventListener("focus",()=>loadServer());
window.addEventListener("online",async()=>{await loadServer();await persistAll()});
window.addEventListener("beforeunload",e=>{
  if(state.dirty || state.draftDirty){e.preventDefault();e.returnValue="";}
});
</script>
</body>
</html>
